[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armands"
version = "0.2.0"
description = "Python library for EDA, visualization, preprocessing, and machine learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "ArmanDS" }]
keywords = ["data-science", "eda", "machine-learning", "pandas", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.3.0",
    "category-encoders>=2.3.0",
    "joblib>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/armanghazi/ArmanDS"
Repository = "https://github.com/armanghazi/ArmanDS.git"
Issues = "https://github.com/armanghazi/ArmanDS/issues"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools]
package-dir = { armands = ".", "armands.eda" = "eda", "armands.ml" = "ml", "armands.preprocessing" = "preprocessing", "armands.visualizations" = "visualizations" }
packages = [
    "armands",
    "armands.eda",
    "armands.ml",
    "armands.preprocessing",
    "armands.visualizations",
]
