[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armands"
version = "0.2.0"
description = "Biblioteca para EDA, visualización, preprocesamiento y machine learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "ArmanDS" }]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.3.0",
    "category-encoders>=2.3.0",
    "joblib>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/armanghazi/ArmanDS"
Repository = "https://github.com/armanghazi/ArmanDS.git"

[tool.setuptools.packages.find]
where = ["src"]
